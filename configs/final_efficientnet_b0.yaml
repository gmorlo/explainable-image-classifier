# Chosen by val macro-F1 averaged over seeds 42, 1, 2 (grid + seed repeats, 2026-10-28):
# lr 3e-4 / batch 16 / wd 0 -> 0.919 +- 0.015 vs lr 1e-3 -> 0.911 +- 0.022.
seed: 42
model: efficientnet_b0
num_classes: 6
batch_size: 16
num_workers: 0
max_epochs: 25
patience: 5
optimizer: adam
weight_decay: 0.0
variants:
  finetune:
    lr: 3.0e-4
    trainable: finetune
