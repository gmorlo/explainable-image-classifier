name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch keeps the runner install small; the code path is the same as on CUDA.
      - run: >
          pip install --extra-index-url https://download.pytorch.org/whl/cpu
          torch torchvision numpy Pillow matplotlib scikit-learn tqdm pytest
      - run: pytest -q tests
